server:
  port: 8082

spring:
  application:
    name: servicio-turnos

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/turnos_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      secret: ${APP_JWT_SECRET:}
      issuer: ${APP_JWT_ISSUER:servicio-turnos}
      expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8081}
  connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:3000}

turnos:
  availability:
    max-days: ${TURNOS_AVAILABILITY_MAX_DAYS:31}
