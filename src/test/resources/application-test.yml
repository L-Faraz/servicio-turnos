spring:
  datasource:
    url: jdbc:h2:mem:turnos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  security:
    jwt:
      secret: test-secret-with-at-least-32-bytes-for-hs256
      issuer: servicio-turnos

catedra:
  api-base-url: http://catedra.test
  jwt-token: test-token
  kafka-enabled: false

turnos:
  outbox:
    enabled: false
  recovery:
    enabled: false
