spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt:
      secret: test-secret-with-at-least-32-bytes-for-hs256
      issuer: servicio-turnos

catedra:
  api-base-url: http://catedra.test
  jwt-token: test-token
  kafka-enabled: false

turnos:
  outbox:
    enabled: false
