name: servicio-turnos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-turnos_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - ${DB_PORT:-5433}:5432
    volumes:
      - turnos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-turnos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - turnos

  servicio-turnos:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-turnos_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:-http://host.docker.internal:8081}
      CATALOG_CONNECT_TIMEOUT_MS: ${CATALOG_CONNECT_TIMEOUT_MS:-2000}
      CATALOG_READ_TIMEOUT_MS: ${CATALOG_READ_TIMEOUT_MS:-3000}
      CATEDRA_API_URL: ${CATEDRA_API_URL:-http://host.docker.internal:8090}
      CATEDRA_JWT_TOKEN: ${CATEDRA_JWT_TOKEN:-}
      CATEDRA_CONNECT_TIMEOUT_MS: ${CATEDRA_CONNECT_TIMEOUT_MS:-2000}
      CATEDRA_READ_TIMEOUT_MS: ${CATEDRA_READ_TIMEOUT_MS:-3000}
      CATEDRA_GROUP_ID: ${CATEDRA_GROUP_ID:-proyecto-l-faraz}
      CATEDRA_KAFKA_ENABLED: ${CATEDRA_KAFKA_ENABLED:-true}
      CATEDRA_KAFKA_BOOTSTRAP_SERVERS: ${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9094}
      CATEDRA_KAFKA_CONSUMER_GROUP_ID: ${CATEDRA_KAFKA_CONSUMER_GROUP_ID:-alumnos-${CATEDRA_GROUP_ID:-proyecto-l-faraz}}
      CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC: ${CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC:-alumnos.turnos.acciones.${CATEDRA_GROUP_ID:-proyecto-l-faraz}}
      CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC: ${CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC:-catedra.turnos.telefono.${CATEDRA_GROUP_ID:-proyecto-l-faraz}}
      CATEDRA_KAFKA_DLT_TOPIC: ${CATEDRA_KAFKA_DLT_TOPIC:-alumnos.turnos.acciones.${CATEDRA_GROUP_ID:-proyecto-l-faraz}.dlt}
      CATEDRA_KAFKA_SECURITY_PROTOCOL: ${CATEDRA_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CATEDRA_KAFKA_RETRY_INITIAL_MS: ${CATEDRA_KAFKA_RETRY_INITIAL_MS:-1000}
      CATEDRA_KAFKA_MAX_RETRIES: ${CATEDRA_KAFKA_MAX_RETRIES:-3}
      CATEDRA_KAFKA_SASL_MECHANISM: ${CATEDRA_KAFKA_SASL_MECHANISM:-}
      CATEDRA_KAFKA_SASL_JAAS_CONFIG: ${CATEDRA_KAFKA_SASL_JAAS_CONFIG:-}
      CATEDRA_KAFKA_SSL_TRUSTSTORE_LOCATION: ${CATEDRA_KAFKA_SSL_TRUSTSTORE_LOCATION:-}
      CATEDRA_KAFKA_SSL_TRUSTSTORE_PASSWORD: ${CATEDRA_KAFKA_SSL_TRUSTSTORE_PASSWORD:-}
      CATEDRA_KAFKA_SSL_TRUSTSTORE_TYPE: ${CATEDRA_KAFKA_SSL_TRUSTSTORE_TYPE:-JKS}
      CATEDRA_KAFKA_SSL_KEYSTORE_LOCATION: ${CATEDRA_KAFKA_SSL_KEYSTORE_LOCATION:-}
      CATEDRA_KAFKA_SSL_KEYSTORE_PASSWORD: ${CATEDRA_KAFKA_SSL_KEYSTORE_PASSWORD:-}
      CATEDRA_KAFKA_SSL_KEYSTORE_TYPE: ${CATEDRA_KAFKA_SSL_KEYSTORE_TYPE:-JKS}
      CATEDRA_KAFKA_SSL_KEY_PASSWORD: ${CATEDRA_KAFKA_SSL_KEY_PASSWORD:-}
      CATEDRA_KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ${CATEDRA_KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET es obligatorio}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-servicio-turnos}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-3600000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      TURNOS_AVAILABILITY_MAX_DAYS: ${TURNOS_AVAILABILITY_MAX_DAYS:-31}
      TURNOS_OUTBOX_ENABLED: ${TURNOS_OUTBOX_ENABLED:-true}
      TURNOS_OUTBOX_MAX_ATTEMPTS: ${TURNOS_OUTBOX_MAX_ATTEMPTS:-5}
      TURNOS_OUTBOX_RETRY_INITIAL_MS: ${TURNOS_OUTBOX_RETRY_INITIAL_MS:-2000}
      TURNOS_OUTBOX_RETRY_MULTIPLIER: ${TURNOS_OUTBOX_RETRY_MULTIPLIER:-2}
      TURNOS_OUTBOX_PUBLISH_INTERVAL_MS: ${TURNOS_OUTBOX_PUBLISH_INTERVAL_MS:-2000}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${TURNOS_PORT:-8082}:8082
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - turnos

volumes:
  turnos_db_data:

networks:
  turnos:
